<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">
    <title>My products</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">

</head>
<body>

<div layout:fragment="content">
<div class="p-3">
    <a class="btn btn-primary" th:href="@{/admin/newProduct}">New Product</a>
</div>
    <table class="table">

        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="p:${products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.quantity}"></td>

            <td sec:authorize="hasRole('ADMIN')">
                <form method="post" th:action="@{/admin/deleteProduct(id=${p.id})}">
                   <button type="submit" class="btn-danger"  onclick="return confirm('Are you sure?')"  >Delete</button>
                </form>
<!--                <a class="btn btn-danger"-->
<!--                   onclick="return confirm('Are you sure?')"-->
<!--                   th:href="@{/admin/deleteProduct(id=${p.id})}">-->
<!--                    Delete-->
<!--                </a>-->
            </td>

        </tr>

        </tbody>

    </table>

</div>
<script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>

</body>

</html>
