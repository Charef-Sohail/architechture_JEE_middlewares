<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout1"
>
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
</head>
<body>
<div class="p-3" layout:fragment="content1">
<table class="table">
    <thead>
    <tr>
        <th>ID</th><th>Name</th><th>Price</th><th>Quantity</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p:${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.quantity}"></td>

        <td>

            <a onclick="return confirm('are you sure?')" class="btn btn-danger" th:href="@{/deleteProduct(id=${p.id})}">Delete</a>
        </td>

    </tr>
    </tbody>
</table>
</div>
